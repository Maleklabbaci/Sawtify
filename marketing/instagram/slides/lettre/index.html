<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sawtify · carrousel darija + français</title>
<style>
  :root{
    --vio:#6D27EA; --ink:#181028; --orange:#FD6029; --cream:#F4F1E9;
    --mut:#8B7CA8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#14101F;color:#fff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;background:#0F0C18;border-bottom:1px solid #2A2340;
  }
  header b{font-size:13px;letter-spacing:.14em}
  header .sub{font-size:11.5px;color:var(--mut)}
  .tabs{margin-left:auto;display:flex;gap:8px}
  .tabs button{
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;
    padding:7px 14px;border-radius:99px;cursor:pointer;
    border:1px solid #3A3155;background:#1C1730;color:#CFC4E8;
  }
  .tabs button[aria-selected="true"]{
    background:var(--orange);border-color:var(--orange);color:#fff;
  }

  main{flex:1 1 auto;display:flex;min-height:0}

  .stage{
    flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    gap:18px;padding:16px;min-width:0;position:relative;
  }
  .stage img{
    max-width:100%;max-height:calc(100dvh - 210px);height:auto;
    border-radius:14px;box-shadow:0 24px 60px #000a;display:block;
    background:#1C1730;
  }
  .arrow{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;
    border:1px solid #3A3155;background:#1C1730;color:#fff;cursor:pointer;
    font-size:19px;line-height:1;display:grid;place-items:center;
  }
  .arrow:hover{background:#2A2340}

  aside{
    flex:0 0 auto;width:118px;border-left:1px solid #2A2340;
    background:#0F0C18;overflow-y:auto;padding:12px 10px;
    display:flex;flex-direction:column;gap:10px;
  }
  aside button{
    padding:0;border:0;background:none;cursor:pointer;border-radius:8px;
    overflow:hidden;position:relative;outline-offset:2px;
  }
  aside img{display:block;width:100%;height:auto;border-radius:8px;opacity:.55;
    transition:opacity .15s, transform .15s}
  aside button[aria-current="true"] img{opacity:1;transform:scale(1);box-shadow:0 0 0 2px var(--orange)}
  aside .num{
    position:absolute;left:5px;bottom:5px;font-size:9.5px;font-weight:800;
    letter-spacing:.08em;background:#0F0C18cc;padding:1px 5px;border-radius:99px;
  }

  footer{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:9px 18px;background:#0F0C18;border-top:1px solid #2A2340;
    font-size:11.5px;color:var(--mut);letter-spacing:.05em;
  }
  footer .cap{color:#fff;font-weight:700;letter-spacing:.08em}
  footer a{color:#CFC4E8}

  @media (max-width:760px){
    aside{display:none}
    .stage{padding:10px;gap:8px}
    .stage img{max-height:calc(100dvh - 190px)}
    .arrow{width:34px;height:34px;font-size:16px}
  }
</style>
</head>
<body>
<header>
  <b>SAWTIFY</b>
  <span class="sub">carrousel 1080 × 1350 · darija algéroise + français</span>
  <div class="tabs" role="tablist" aria-label="langue">
    <button role="tab" data-lang="dz" aria-selected="true">DARIJA</button>
    <button role="tab" data-lang="fr" aria-selected="false">FRANÇAIS</button>
  </div>
</header>

<main>
  <div class="stage">
    <button class="arrow" id="prev" aria-label="slide précédente">‹</button>
    <img id="slide" alt="">
    <button class="arrow" id="next" aria-label="slide suivante">›</button>
  </div>
  <aside id="thumbs" aria-label="slides"></aside>
</main>

<footer>
  <span class="cap" id="caption">dz 01</span>
  <span id="role">couverture</span>
  <span id="count" style="margin-left:auto">1 / 5</span>
</footer>

<script>
const ROLES = ["couverture","le mécanisme","les 3 gestes","le chiffre","CTA"];
const state = { lang: "dz", i: 0 };
const img = document.getElementById("slide");
const thumbs = document.getElementById("thumbs");
const cap = document.getElementById("caption");
const role = document.getElementById("role");
const count = document.getElementById("count");

function pad(n){ return String(n).padStart(2,"0"); }

function buildThumbs(){
  thumbs.innerHTML = "";
  for (let i=0;i<5;i++){
    const b = document.createElement("button");
    b.innerHTML = `<img src="${state.lang}/${pad(i+1)}.jpg" alt=""><span class="num">${pad(i+1)}</span>`;
    b.setAttribute("aria-current", i === state.i ? "true" : "false");
    b.onclick = () => go(i);
    thumbs.appendChild(b);
  }
}

function paint(){
  img.src = `${state.lang}/${pad(state.i+1)}.jpg`;
  img.alt = `${state.lang} ${pad(state.i+1)}`;
  cap.textContent = `${state.lang} ${pad(state.i+1)}`;
  role.textContent = ROLES[state.i];
  count.textContent = `${state.i+1} / 5`;
  [...thumbs.children].forEach((b,i)=>b.setAttribute("aria-current", i===state.i?"true":"false"));
  const active = thumbs.children[state.i];
  if (active) active.scrollIntoView({block:"nearest"});
}

function go(i){
  state.i = (i + 5) % 5;
  paint();
}

document.getElementById("prev").onclick = () => go(state.i - 1);
document.getElementById("next").onclick = () => go(state.i + 1);

document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = () => {
    state.lang = b.dataset.lang;
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    buildThumbs(); paint();
  };
});

addEventListener("keydown", e=>{
  if (e.key === "ArrowLeft") go(state.i - 1);
  if (e.key === "ArrowRight") go(state.i + 1);
  if (e.key === "ArrowUp") go(0);
});

buildThumbs(); paint();
</script>
</body>
</html>
