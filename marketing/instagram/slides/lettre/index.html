<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sawtify — carrousel lettre</title>
<style>
  :root{--paper:#F2F1ED;--ink:#111113;--vio:#6D27EA;--mut:#8C82A6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#111113;color:#F2F1ED;
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;
         background:rgba(17,17,19,.96);border-bottom:1px solid #2a2436;position:sticky;top:0;z-index:5}
  h1{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin:0;color:#B39BFF}
  .tabs{margin-left:auto;display:flex;gap:8px}
  button{background:transparent;border:1px solid #3a3054;color:#cfc7e6;border-radius:99px;
         padding:6px 15px;font:inherit;font-size:12px;letter-spacing:.12em;cursor:pointer}
  button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px;
        scrollbar-width:thin}
  figure{margin:0;flex:0 0 auto;scroll-snap-align:center;width:min(88vw,430px)}
  img{width:100%;display:block;border-radius:10px;background:#1c1730}
  figcaption{font-size:11px;letter-spacing:.14em;color:var(--mut);padding:7px 2px}
  .hint{padding:0 14px 20px;font-size:12px;color:var(--mut)}
</style></head>
<body>
<header>
  <h1>Sawtify — carrousel</h1>
  <div class="tabs"><button id="dz" class="on">Darija</button><button id="fr">Français</button></div>
</header>
<main class="rail" id="rail"></main>
<p class="hint">Glisse horizontalement · 5 slides · 1080 × 1350</p>
<script>
var lang="dz";
var L={dz:["01 · شكون احنا","02 · المشكل","03 · واش تدير","04 · الفرق","05 · و من بعد"],
       fr:["01 · Qui on est","02 · Le problème","03 · Quoi faire","04 · L'écart","05 · Et après"]};
function draw(){
  var r=document.getElementById("rail"); r.innerHTML="";
  for(var i=1;i<=5;i++){
    var f=document.createElement("figure");
    var im=document.createElement("img");
    im.src=lang+"/0"+i+".jpg?v="+Date.now();
    var c=document.createElement("figcaption");
    c.textContent=L[lang][i-1];
    f.appendChild(im); f.appendChild(c); r.appendChild(f);
  }
  document.getElementById("dz").className = lang=="dz"?"on":"";
  document.getElementById("fr").className = lang=="fr"?"on":"";
}
document.getElementById("dz").onclick=function(){lang="dz";draw();};
document.getElementById("fr").onclick=function(){lang="fr";draw();};
draw();
</script>
</body></html>
