name: Instagram — publication automatique du carrousel du jour

# Tourne 2 fois par heure. Le script ne publie que si la date/heure du
# manifeste correspond (fuseau Africa/Algiers) et que le jour n'est pas
# déjà dans auto/state/published.json.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Forcer un jour (ex. J05) — laisser vide pour le mode normal"
        required: false
      dry_run:
        description: "Simulation sans publication (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        run: pip install --quiet pillow

      - name: Publier
        working-directory: marketing/instagram/auto
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -e
          ARGS=""
          if [ -n "${{ github.event.inputs.day }}" ]; then
            ARGS="--day ${{ github.event.inputs.day }} --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 auto_publish.py $ARGS

      - name: Enregistrer l'état (anti-doublon)
        if: always()
        run: |
          if [ -n "$(git status --porcelain marketing/instagram/auto/state)" ]; then
            git config user.name  "sawtify-bot"
            git config user.email "bot@sawtify.space"
            git add marketing/instagram/auto/state
            git commit -m "auto: état de publication $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Aucun changement d'état."
          fi
